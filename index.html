<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Динамика массы тела</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1018">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f1720;
            color: #e8eef5;
            display: flex;
            padding: 6px;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a2332;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.5);
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }

        .period-bar {
            position: relative;
            display: flex;
            gap: 4px;
            margin: 0 0 0;
            padding: 0 4px;
            flex-shrink: 0;
            align-items: flex-end;
            border-bottom: 1px solid #0a1018;
        }
        .period-btn {
            position: relative;
            background: linear-gradient(135deg, #1e2a3a 0%, #243447 100%);
            color: #a8bccf;
            border: 1px solid #2c3a4f;
            border-bottom: none;
            padding: 9px 8px 8px;
            border-radius: 10px 10px 0 0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
            width: 90px;
            flex: 0 0 90px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: -1px;
            box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25);
            transition:
                background 0.25s ease,
                color 0.2s ease,
                transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.3s ease;
            will-change: transform;
        }
        .period-btn:hover {
            background: linear-gradient(135deg, #263347 0%, #2d3f55 100%);
            color: #c8d8e8;
            transform: translateY(-2px);
            box-shadow:
                inset 0 -3px 6px rgba(0,0,0,0.25),
                0 6px 14px rgba(0,0,0,0.45);
        }
        .period-btn.active {
            background: #a8bccf;
            color: #1a2332;
            border-color: #a8bccf;
            transform: translateY(1px);
            z-index: 2;
            box-shadow: 0 -2px 6px rgba(168, 188, 207, 0.35);
        }
        .period-btn.compare {
            margin-left: auto;
            width: auto;
            flex: 0 0 auto;
            min-width: 110px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin: 6px 0 4px;
            flex-shrink: 0;
            align-items: stretch;
        }
        .stat-item {
            background: #0a1018;
            padding: 5px 5px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.25s, box-shadow 0.25s;
            opacity: 0;
            animation: fadeInUp 0.5s forwards;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .stat-item:nth-child(1) { animation-delay: 0.05s; }
        .stat-item:nth-child(2) { animation-delay: 0.10s; }
        .stat-item:nth-child(3) { animation-delay: 0.15s; }
        .stat-item:nth-child(4) { animation-delay: 0.20s; }
        .stat-item:nth-child(5) { animation-delay: 0.25s; }
        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        }
        .stat-item h3 {
            margin: 0 0 2px;
            font-size: 8px;
            color: #8aa0b4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-item p {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: #4db8ff;
            white-space: nowrap;
            line-height: 1.05;
        }
        #totalChange,
        #swingValue {
            color: #ffffff !important;
        }
        .stat-item p small {
            display: block;
            font-size: 8px;
            font-weight: 500;
            color: #8aa0b4;
            margin-top: 1px;
            white-space: nowrap;
            line-height: 1.05;
        }
        .trend-arrow {
            display: inline-block;
            font-size: 20px;
            font-weight: 900;
            margin-left: 3px;
            vertical-align: middle;
            line-height: 1;
            transform: scaleY(0.65) scaleX(1);
            transform-origin: center center;
        }
        .trend-up { color: #e74c3c; }
        .trend-down { color: #27ae60; }
        .trend-same { color: #8aa0b4; }

        .chart-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 200px;
            background-color: #0a1018;
            border-radius: 10px;
            padding: 4px;
            min-width: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        .chart-inner {
            position: absolute;
            inset: 4px;
            transition: transform 0.22s ease-in-out, opacity 0.22s ease-in-out;
            will-change: transform, opacity;
        }
        /* Перелистывание страниц — для переходов со «Сравнением» */
        .chart-inner.slide-out-left {
            transform: translateX(-25%);
            opacity: 0;
        }
        .chart-inner.slide-out-right {
            transform: translateX(25%);
            opacity: 0;
        }
        .chart-inner.slide-in-from-right {
            transform: translateX(25%);
            opacity: 0;
            transition: none;
        }
        .chart-inner.slide-in-from-left {
            transform: translateX(-25%);
            opacity: 0;
            transition: none;
        }
        .chart-inner.slide-in-enter {
            transform: translateX(0);
            opacity: 1;
            transition: transform 0.22s ease-out, opacity 0.22s ease-out;
        }
        /* Зум при смене периодов: правый край неподвижен, диаграмма тянется влево */
        .chart-inner.zoom-out {
            transform: scaleX(0.35);
            transform-origin: right center;
            opacity: 0.15;
        }
        .chart-inner.zoom-in-prep {
            transform: scaleX(0.35);
            transform-origin: right center;
            opacity: 0;
            transition: none;
        }
        .chart-inner.zoom-in-enter {
            transform: scaleX(1);
            transform-origin: right center;
            opacity: 1;
            transition: transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1),
                        opacity 0.32s ease-out;
        }

        /* Кнопка переключения типа диаграммы */
        .type-toggle {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(26, 35, 50, 0.85);
            border: 1px solid #2c3a4f;
            color: #c8d8e8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            user-select: none;
            transition: background 0.15s, color 0.15s, transform 0.15s;
            backdrop-filter: blur(4px);
        }
        .type-toggle:hover {
            background: rgba(44, 58, 79, 0.95);
            color: #ffffff;
            transform: scale(1.05);
        }
        .type-toggle.hidden {
            display: none;
        }
        .type-toggle svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        #loading, #error {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #8aa0b4;
            margin: auto;
        }
        #error {
            color: #e74c3c;
            display: none;
        }
        #dashboard {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        html.chart-fullscreen,
        body.chart-fullscreen {
            padding: 0 !important;
            overflow: hidden !important;
        }
        body.chart-fullscreen .container {
            padding: 0;
            border-radius: 0;
            background: #0a1018;
            box-shadow: none;
        }
        body.chart-fullscreen .stats,
        body.chart-fullscreen .period-bar,
        body.chart-fullscreen #loading,
        body.chart-fullscreen #error {
            display: none !important;
        }
        body.chart-fullscreen #dashboard {
            display: flex !important;
        }
        body.chart-fullscreen .chart-container {
            border-radius: 0;
            padding: 0;
            background: #0a1018;
        }
        body.chart-fullscreen .chart-inner {
            inset: 0;
        }
        .fullscreen-hint {
            display: none;
            position: fixed;
            top: 12px;
            right: 12px;
            background: rgba(10, 16, 24, 0.75);
            color: #8aa0b4;
            border: 1px solid #2c3a4f;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            z-index: 1000;
            pointer-events: none;
            user-select: none;
            backdrop-filter: blur(4px);
        }
        body.chart-fullscreen .fullscreen-hint {
            display: block;
        }

        @media (max-width: 1100px) {
            .stat-item p { font-size: 14px; }
            .trend-arrow { font-size: 18px; }
        }
        @media (max-width: 900px) {
            .period-bar { gap: 3px; padding: 0 3px; }
            .period-btn { width: 75px; flex: 0 0 75px; font-size: 11px; padding: 8px 6px 7px; border-radius: 9px 9px 0 0; }
            .period-btn.compare { min-width: 95px; font-size: 11px; }
            .stats { gap: 5px; margin: 5px 0 3px; }
            .stat-item { padding: 5px 4px; }
            .stat-item p { font-size: 13px; }
            .stat-item h3 { font-size: 7px; }
            .stat-item p small { font-size: 7px; }
            .trend-arrow { font-size: 16px; }
        }
        @media (max-width: 600px) {
            body { padding: 4px; }
            .container { padding: 6px; border-radius: 10px; }
            .period-bar { gap: 3px; padding: 0 2px; }
            .period-btn { width: 62px; flex: 0 0 62px; font-size: 10px; padding: 8px 5px 7px; border-radius: 8px 8px 0 0; }
            .period-btn.compare { min-width: 80px; font-size: 10px; }
            .stats { gap: 4px; margin: 5px 0 3px; }
            .stat-item { padding: 4px 3px; border-radius: 6px; }
            .stat-item h3 { font-size: 7px; letter-spacing: 0.2px; margin-bottom: 1px; }
            .stat-item p { font-size: 12px; }
            .stat-item p small { font-size: 7px; }
            .trend-arrow { font-size: 14px; margin-left: 2px; }
            .chart-container { padding: 3px; border-radius: 8px; }
            .chart-inner { inset: 3px; }
            .type-toggle { width: 26px; height: 26px; top: 4px; right: 4px; }
            .type-toggle svg { width: 14px; height: 14px; }
        }
        @media (max-width: 420px) {
            .stat-item h3 { display: none; }
            .stat-item { padding: 4px 2px; }
            .period-btn { width: 54px; flex: 0 0 54px; font-size: 9px; padding: 7px 4px 6px; border-radius: 7px 7px 0 0; }
            .period-btn.compare { min-width: 72px; font-size: 9px; }
            .trend-arrow { font-size: 13px; }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            .period-bar { gap: 3px; padding: 0 3px; }
            .period-btn { width: 75px; flex: 0 0 75px; font-size: 10px; padding: 8px 6px 7px; border-radius: 9px 9px 0 0; }
            .period-btn.compare { min-width: 95px; font-size: 10px; }
            .stats { gap: 4px; margin: 5px 0 3px; }
            .stat-item { padding: 4px 3px; }
            .stat-item h3 { font-size: 7px; margin-bottom: 1px; }
            .stat-item p { font-size: 11px; }
            .stat-item p small { font-size: 7px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">Загрузка данных...</div>
        <div id="error"></div>

        <div id="dashboard">
            <div class="period-bar" id="periodBar">
                <button class="period-btn active" data-period="all">Всё время</button>
                <button class="period-btn" data-period="1y">1 год</button>
                <button class="period-btn" data-period="6m">6 месяцев</button>
                <button class="period-btn" data-period="3m">3 месяца</button>
                <button class="period-btn" data-period="1m">1 месяц</button>
                <button class="period-btn compare" id="compareBtn">Сравнение</button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <h3>Текущая масса</h3>
                    <p id="currentWeight">--</p>
                </div>
                <div class="stat-item">
                    <h3>Максимум</h3>
                    <p id="maxWeight">--</p>
                </div>
                <div class="stat-item">
                    <h3>Минимум</h3>
                    <p id="minWeight">--</p>
                </div>
                <div class="stat-item">
                    <h3>Изменение</h3>
                    <p id="totalChange">--</p>
                </div>
                <div class="stat-item">
                    <h3>Колебание</h3>
                    <p id="swingValue">--</p>
                </div>
            </div>

            <div class="chart-container" id="chartContainer">
                <div class="chart-inner" id="chartInner">
                    <canvas id="weightChart"></canvas>
                </div>

                <div class="type-toggle" id="typeToggle" title="Переключить тип диаграммы">
                    <svg id="iconBars" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="8" width="3" height="6" fill="currentColor" rx="0.5"/>
                        <rect x="6.5" y="4" width="3" height="10" fill="currentColor" rx="0.5"/>
                        <rect x="11" y="6" width="3" height="8" fill="currentColor" rx="0.5"/>
                    </svg>
                    <svg id="iconLine" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
                        <path d="M2 12 L6 7 L9 9 L14 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="2" cy="12" r="1.3" fill="currentColor"/>
                        <circle cx="6" cy="7" r="1.3" fill="currentColor"/>
                        <circle cx="9" cy="9" r="1.3" fill="currentColor"/>
                        <circle cx="14" cy="3" r="1.3" fill="currentColor"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div class="fullscreen-hint">Двойной тап — выйти</div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCxUQ2eWCaI8HwAvEFRVc1VzXgjun4Gkx5K6vk3x7dHyKaaq_GHatCTUMkh2vb2EYIWCtVUmnLnPiE/pub?output=csv';

        const MONTHS_RU = [
            'Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн',
            'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'
        ];
        const MONTHS_RU_FULL = [
            'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
        ];

        const RANGE_COLORS = {
            69: '#1F9E1F',
            70: '#66FF66',
            71: '#00B0F0',
            72: '#4472C4',
            73: '#7030A0',
            74: '#CC0099',
            75: '#FF0000',
            76: '#B20000'
        };

        const YEAR_COLORS = [
            '#00A6FF', '#FFEA00', '#FF0000', '#00C853', '#B23BFF', '#00E5D0', '#FF6A00'
        ];

        const Y_GRID_COLOR      = 'rgba(255,255,255,0.10)';
        const START_LINE_COLOR  = 'rgba(255,255,255,0.25)';
        const MONTH_GRID_COLOR  = 'rgba(255,255,255,0.06)';
        const MONTH_GRID_COLOR_COMPARE = 'rgba(255,255,255,0.08)';
        const YEAR_LINE_COLOR   = 'rgba(200,216,232,0.25)';

        const V_AXIS_DATE = new Date(2024, 7, 1);
        const MAX_DATE = new Date(2026, 11, 31, 23, 59, 59);
        const X_MAX_DATE = new Date(2026, 11, 31);

        const SWIPE_ORDER = ['1m', '3m', '6m', '1y', 'all', 'compare'];
        const VISUAL_ORDER = ['all', '1y', '6m', '3m', '1m', 'compare'];

        let ALL_ENTRIES = [];
        let CURRENT_PERIOD = 'all';
        let COMPARE_MODE = false;
        let chart = null;

        // Тип диаграммы для обычных периодов: 'bar' | 'line'
        // Тип диаграммы для сравнения: 'line' (с линией) | 'scatter' (только точки)
        let CHART_KIND = 'bar';
        let COMPARE_KIND = 'line';

        let switchInProgress = false;
        let LAST_BREAKPOINT = -1;

        let wheelAccum = 0;
        let wheelTimer = null;

        const statAnimators = {
            currentWeight: { current: null, rafId: null },
            maxWeight:     { current: null, rafId: null },
            minWeight:     { current: null, rafId: null },
            totalChange:   { current: null, rafId: null },
            swingValue:    { current: null, rafId: null }
        };

        function colorForWeight(w) {
            const key = Math.floor(w);
            if (RANGE_COLORS[key] !== undefined) return RANGE_COLORS[key];
            if (key < 69) return RANGE_COLORS[69];
            return RANGE_COLORS[76];
        }

        function colorForYear(year) {
            const BASE_YEAR = 2024;
            const idx = ((year - BASE_YEAR) % YEAR_COLORS.length + YEAR_COLORS.length) % YEAR_COLORS.length;
            return YEAR_COLORS[idx];
        }

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function getPointRadiusForScreen() {
            const w = window.innerWidth;
            if (w < 420) return { r: 1.2, hr: 2.6 };
            if (w < 600) return { r: 1.5, hr: 3.2 };
            if (w < 900) return { r: 1.9, hr: 4.0 };
            return { r: 2.3, hr: 4.7 };
        }

        function currentBreakpoint() {
            const w = window.innerWidth;
            if (w < 420) return 1;
            if (w < 600) return 2;
            if (w < 900) return 3;
            return 4;
        }

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                const next = text[i + 1];
                if (inQuotes) {
                    if (ch === '"' && next === '"') { cell += '"'; i++; }
                    else if (ch === '"') { inQuotes = false; }
                    else { cell += ch; }
                } else {
                    if (ch === '"') { inQuotes = true; }
                    else if (ch === ',') { row.push(cell); cell = ''; }
                    else if (ch === '\n' || ch === '\r') {
                        if (ch === '\r' && next === '\n') i++;
                        row.push(cell);
                        rows.push(row);
                        row = [];
                        cell = '';
                    } else { cell += ch; }
                }
            }
            if (cell.length > 0 || row.length > 0) { row.push(cell); rows.push(row); }
            return rows.filter(r => r.some(c => c.trim() !== ''));
        }

        function formatDateShort(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = String(date.getFullYear()).slice(-2);
            return `${d}.${m}.${y}`;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function getBarParams(period) {
            if (period === '1m' || period === '3m') {
                return { barPercentage: 0.85, categoryPercentage: 0.95 };
            }
            return { barPercentage: 1.0, categoryPercentage: 1.0 };
        }

        function getPadBottom() {
            const isSmall = window.innerWidth < 600;
            const isLandscapePhone = window.innerWidth < 900 && window.innerWidth > window.innerHeight;
            if (isLandscapePhone) return 44;
            if (isSmall) return 48;
            return 52;
        }

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

        function animateNumber(el, from, to, duration, formatter) {
            const key = el.id;
            const anim = statAnimators[key];
            if (!anim) { el.innerHTML = formatter(to); return; }
            if (anim.rafId) cancelAnimationFrame(anim.rafId);
            if (from === null || !isFinite(from)) from = to;
            const start = performance.now();
            const delta = to - from;

            function tick(now) {
                const t = Math.min(1, (now - start) / duration);
                const eased = easeOutCubic(t);
                const value = from + delta * eased;
                el.innerHTML = formatter(value);
                if (t < 1) {
                    anim.rafId = requestAnimationFrame(tick);
                } else {
                    anim.rafId = null;
                    anim.current = to;
                }
            }
            anim.rafId = requestAnimationFrame(tick);
        }

        function getLeftEdgeX(chart, idx) {
            const xScale = chart.scales.x;
            const center = xScale.getPixelForValue(idx);
            const half = chart._barWidthHalf != null ? chart._barWidthHalf : (chart._stepHalf || 0);
            return center - half;
        }

        const yAxisLinePlugin = {
            id: 'yAxisLine',
            beforeDatasetsDraw(chart) {
                if (chart._compareMode) return;
                const { ctx, chartArea } = chart;
                if (!chartArea) return;
                if (chart._vAxisIndex == null) return;
                const x = getLeftEdgeX(chart, chart._vAxisIndex);
                if (x < chartArea.left || x > chartArea.right) return;
                ctx.save();
                ctx.beginPath();
                ctx.lineWidth = 1;
                ctx.strokeStyle = START_LINE_COLOR;
                ctx.moveTo(x, chartArea.top);
                ctx.lineTo(x, chartArea.bottom);
                ctx.stroke();
                ctx.restore();
            }
        };

        const yearLinesPlugin = {
            id: 'yearLines',
            beforeDatasetsDraw(chart) {
                if (chart._compareMode) return;
                const { ctx, chartArea } = chart;
                if (!chartArea) return;
                if (!chart._jan1Indices || chart._jan1Indices.length === 0) return;
                ctx.save();
                ctx.setLineDash([]);
                ctx.lineWidth = 1;
                ctx.strokeStyle = YEAR_LINE_COLOR;
                chart._jan1Indices.forEach(idx => {
                    const x = getLeftEdgeX(chart, idx);
                    if (x >= chartArea.left && x <= chartArea.right) {
                        ctx.beginPath();
                        ctx.moveTo(x, chartArea.top);
                        ctx.lineTo(x, chartArea.bottom);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        };

        const monthGridPlugin = {
            id: 'monthGrid',
            beforeDatasetsDraw(chart) {
                if (chart._compareMode) return;
                if (!chart._showMonthGrid) return;
                const { ctx, chartArea } = chart;
                if (!chartArea) return;
                if (!chart._monthSegments) return;
                ctx.save();
                ctx.setLineDash([]);
                ctx.lineWidth = 1;
                ctx.strokeStyle = MONTH_GRID_COLOR;
                chart._monthSegments.forEach(seg => {
                    const x = getLeftEdgeX(chart, seg.startIdx);
                    if (x > chartArea.left && x <= chartArea.right) {
                        ctx.beginPath();
                        ctx.moveTo(x, chartArea.top);
                        ctx.lineTo(x, chartArea.bottom);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        };

        const compareMonthGridPlugin = {
            id: 'compareMonthGrid',
            beforeDatasetsDraw(chart) {
                if (!chart._compareMode) return;
                const { ctx, chartArea } = chart;
                if (!chartArea) return;
                const xScale = chart.scales.x;
                const half = chart._stepHalf || 0;
                const MONTH_START_DAY = [1, 32, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
                ctx.save();
                ctx.setLineDash([]);
                ctx.lineWidth = 1;
                ctx.strokeStyle = MONTH_GRID_COLOR_COMPARE;
                MONTH_START_DAY.forEach(day => {
                    const x = xScale.getPixelForValue(day) - half;
                    if (x > chartArea.left && x <= chartArea.right) {
                        ctx.beginPath();
                        ctx.moveTo(x, chartArea.top);
                        ctx.lineTo(x, chartArea.bottom);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        };

        const minMaxLinesPlugin = {
            id: 'minMaxLines',
            afterDatasetsDraw(chart) {
                if (chart._compareMode) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (chart._maxWeight == null || chart._minWeight == null) return;
                const yScale = scales.y;
                const yMax = yScale.getPixelForValue(chart._maxWeight);
                const yMin = yScale.getPixelForValue(chart._minWeight);
                ctx.save();
                ctx.setLineDash([3, 3]);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = hexToRgba(colorForWeight(chart._maxWeight), 0.5);
                ctx.beginPath();
                ctx.moveTo(chartArea.left, yMax);
                ctx.lineTo(chartArea.right, yMax);
                ctx.stroke();
                ctx.strokeStyle = hexToRgba(colorForWeight(chart._minWeight), 0.5);
                ctx.beginPath();
                ctx.moveTo(chartArea.left, yMin);
                ctx.lineTo(chartArea.right, yMin);
                ctx.stroke();
                ctx.restore();
            },
            afterDraw(chart) {
                if (chart._compareMode) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (chart._maxWeight == null || chart._minWeight == null) return;
                const yScale = scales.y;
                const chartWidth = chartArea.right - chartArea.left;
                const isSmall = chartWidth < 400;
                const fontPx = isSmall ? 8 : 10;
                const pw0 = isSmall ? 8 : 10;
                const ph = isSmall ? 9.5 : 11;
                const drawBadge = (weight, color) => {
                    const y = yScale.getPixelForValue(weight);
                    const x = chartArea.left - 4;
                    ctx.save();
                    ctx.font = `bold ${fontPx}px Inter, sans-serif`;
                    const text = weight.toFixed(1);
                    const tw = ctx.measureText(text).width;
                    const pw = tw + pw0;
                    const bx = x - pw - 2;
                    const by = y - ph / 2;
                    ctx.fillStyle = color;
                    roundRect(ctx, bx, by, pw, ph, 3);
                    ctx.fill();
                    ctx.fillStyle = '#001236';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, bx + pw / 2, by + ph / 2 + 0.5);
                    ctx.restore();
                };
                drawBadge(chart._maxWeight, colorForWeight(chart._maxWeight));
                drawBadge(chart._minWeight, colorForWeight(chart._minWeight));
            }
        };

        const monthLabelsPlugin = {
            id: 'monthLabels',
            afterDraw(chart) {
                if (chart._compareMode) return;
                if (!chart._monthSegments || chart._monthSegments.length === 0) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                const xScale = scales.x;
                const half = chart._barWidthHalf || 0;
                const chartWidth = chartArea.right - chartArea.left;
                const isSmall = chartWidth < 400;
                const fontPx = isSmall ? 8 : 10;
                const offset = isSmall ? 5 : 7;
                ctx.save();
                ctx.font = `bold ${fontPx}px Inter, sans-serif`;
                ctx.fillStyle = 'rgba(200, 216, 232, 0.75)';
                chart._monthSegments.forEach(seg => {
                    const xStart = xScale.getPixelForValue(seg.startIdx) - half;
                    const xEnd   = xScale.getPixelForValue(seg.endIdx) - half;
                    const xCenter = (xStart + xEnd) / 2;
                    if (xCenter >= chartArea.left && xCenter <= chartArea.right) {
                        const label = MONTHS_RU[seg.month];
                        ctx.save();
                        ctx.translate(xCenter, chartArea.bottom + offset);
                        ctx.rotate(-Math.PI / 2);
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(label, 0, 0);
                        ctx.restore();
                    }
                });
                ctx.restore();
            }
        };

        const yearLabelsPlugin = {
            id: 'yearLabels',
            afterDraw(chart) {
                if (chart._compareMode) return;
                if (!chart._yearSegments || chart._yearSegments.length === 0) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                const xScale = scales.x;
                const half = chart._barWidthHalf || 0;
                const chartWidth = chartArea.right - chartArea.left;
                const isSmall = chartWidth < 400;
                const fontPx = isSmall ? 9 : 11;
                const offset = isSmall ? 30 : 34;
                ctx.save();
                ctx.font = `bold ${fontPx}px Inter, sans-serif`;
                ctx.fillStyle = 'rgba(200, 216, 232, 0.55)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                const y = chartArea.bottom + offset;
                chart._yearSegments.forEach(seg => {
                    const xStart = xScale.getPixelForValue(seg.startIdx) - half;
                    const xEnd   = xScale.getPixelForValue(seg.endIdx) - half;
                    const xCenter = (xStart + xEnd) / 2;
                    if (xCenter >= chartArea.left && xCenter <= chartArea.right) {
                        ctx.fillText(seg.year, xCenter, y);
                    }
                });
                ctx.restore();
            }
        };

        // Легенда диапазонов — по центру области графика
        const weightLegendPlugin = {
            id: 'weightLegend',
            afterDraw(chart) {
                if (!chart._showWeightLegend) return;
                const { ctx, chartArea } = chart;
                if (!chartArea) return;

                const usedKeys = new Set();
                let hasBelow = false;
                let hasAbove = false;
                (chart._legendWeights || []).forEach(w => {
                    const k = Math.floor(w);
                    if (k < 69) hasBelow = true;
                    else if (k > 76) hasAbove = true;
                    else usedKeys.add(k);
                });

                const items = [];
                if (hasBelow) items.push({ label: '<69', color: RANGE_COLORS[69] });
                for (let k = 69; k <= 76; k++) {
                    if (usedKeys.has(k)) items.push({ label: String(k), color: RANGE_COLORS[k] });
                }
                if (hasAbove) items.push({ label: '76+', color: RANGE_COLORS[76] });
                if (items.length === 0) return;

                const top = Math.max(2, chartArea.top - 14);
                const isSmall = (chartArea.right - chartArea.left) < 480;
                const fontPx = isSmall ? 9 : 10;
                const boxSize = isSmall ? 8 : 9;
                const textGap = isSmall ? 3 : 4;
                const itemGap = isSmall ? 9 : 12;

                ctx.save();
                ctx.font = `600 ${fontPx}px Inter, sans-serif`;
                ctx.textBaseline = 'middle';

                let maxTextW = 0;
                items.forEach(it => {
                    const w = ctx.measureText(it.label).width;
                    if (w > maxTextW) maxTextW = w;
                });

                const columnWidth = maxTextW + textGap + boxSize;
                const totalWidth = items.length * columnWidth + (items.length - 1) * itemGap;

                // Легенда по центру области графика
                const startX = chartArea.left + ((chartArea.right - chartArea.left) - totalWidth) / 2;

                items.forEach((it, i) => {
                    const colLeft = startX + i * (columnWidth + itemGap);
                    const textRight = colLeft + maxTextW;
                    ctx.fillStyle = '#c8d8e8';
                    ctx.textAlign = 'right';
                    ctx.fillText(it.label, textRight, top + boxSize / 2 + 0.5);
                    const bx = textRight + textGap;
                    ctx.fillStyle = it.color;
                    roundRect(ctx, bx, top, boxSize, boxSize, 2);
                    ctx.fill();
                });

                ctx.restore();
            }
        };

        function filterByPeriod(entries, period) {
            if (period === 'all' || entries.length === 0) return entries.slice();
            const lastDate = entries[entries.length - 1].date;
            const from = new Date(lastDate);
            if (period === '1m') from.setMonth(from.getMonth() - 1);
            else if (period === '3m') from.setMonth(from.getMonth() - 3);
            else if (period === '6m') from.setMonth(from.getMonth() - 6);
            else if (period === '1y') from.setFullYear(from.getFullYear() - 1);
            return entries.filter(e => e.date >= from);
        }

        function updateStats(entries) {
            const currentEl = document.getElementById('currentWeight');
            const changeEl = document.getElementById('totalChange');
            const maxEl = document.getElementById('maxWeight');
            const minEl = document.getElementById('minWeight');
            const swingEl = document.getElementById('swingValue');

            if (entries.length === 0) {
                ['currentWeight', 'totalChange', 'maxWeight', 'minWeight', 'swingValue'].forEach(id => {
                    const el = document.getElementById(id);
                    const anim = statAnimators[id];
                    if (anim.rafId) cancelAnimationFrame(anim.rafId);
                    anim.rafId = null;
                    anim.current = null;
                    el.textContent = '--';
                });
                return;
            }

            const lastEntry = entries[entries.length - 1];
            const prevEntry = entries.length > 1 ? entries[entries.length - 2] : null;
            const firstEntry = entries[0];

            const currentWeight = lastEntry.weight;
            let arrow = '';
            if (prevEntry) {
                const diff = currentWeight - prevEntry.weight;
                if (Math.abs(diff) < 0.05) arrow = '<span class="trend-arrow trend-same">→</span>';
                else if (diff > 0) arrow = '<span class="trend-arrow trend-up">↑</span>';
                else arrow = '<span class="trend-arrow trend-down">↓</span>';
            }
            const currentFrom = statAnimators.currentWeight.current;
            animateNumber(currentEl, currentFrom, currentWeight, 500, v => {
                return v.toFixed(1) + ' кг' + arrow +
                    '<small>' + formatDateShort(lastEntry.date) + '</small>';
            });
            currentEl.style.color = colorForWeight(currentWeight);

            const change = lastEntry.weight - firstEntry.weight;
            let changeArrow = '';
            if (Math.abs(change) < 0.05) {
                changeArrow = '<span class="trend-arrow trend-same">→</span>';
            } else if (change > 0) {
                changeArrow = '<span class="trend-arrow trend-up">↑</span>';
            } else {
                changeArrow = '<span class="trend-arrow trend-down">↓</span>';
            }
            const range = formatDateShort(firstEntry.date) + ' → ' + formatDateShort(lastEntry.date);
            const changeFrom = statAnimators.totalChange.current;
            animateNumber(changeEl, changeFrom, change, 500, v => {
                const sign = v > 0 ? '+' : '';
                return sign + v.toFixed(1) + ' кг' + changeArrow + '<small>' + range + '</small>';
            });

            let maxW = -Infinity, minW = Infinity;
            let maxD = null, minD = null;
            entries.forEach(e => {
                if (e.weight > maxW) { maxW = e.weight; maxD = e.date; }
                if (e.weight < minW) { minW = e.weight; minD = e.date; }
            });
            const maxFrom = statAnimators.maxWeight.current;
            animateNumber(maxEl, maxFrom, maxW, 500, v =>
                v.toFixed(1) + ' кг<small>' + formatDateShort(maxD) + '</small>'
            );
            maxEl.style.color = colorForWeight(maxW);

            const minFrom = statAnimators.minWeight.current;
            animateNumber(minEl, minFrom, minW, 500, v =>
                v.toFixed(1) + ' кг<small>' + formatDateShort(minD) + '</small>'
            );
            minEl.style.color = colorForWeight(minW);

            const swing = maxW - minW;
            const swingFrom = statAnimators.swingValue.current;
            animateNumber(swingEl, swingFrom, swing, 500, v =>
                v.toFixed(1) + ' кг<small>' + minW.toFixed(1) + ' → ' + maxW.toFixed(1) + '</small>'
            );
        }

        function buildNormalChartData(entries, extendToMaxDate) {
            if (entries.length === 0) {
                return { labels: [], weights: [], jan1Indices: [], yearSegments: [], monthSegments: [], vAxisIndex: 0 };
            }
            const firstDate = new Date(entries[0].date);
            firstDate.setHours(0, 0, 0, 0);
            const lastDate = extendToMaxDate
                ? new Date(X_MAX_DATE)
                : new Date(entries[entries.length - 1].date);
            lastDate.setHours(0, 0, 0, 0);

            const byDay = {};
            entries.forEach(e => {
                const d = new Date(e.date);
                d.setHours(0, 0, 0, 0);
                byDay[d.toISOString().slice(0, 10)] = e.weight;
            });

            const labels = [];
            const weights = [];
            const dates = [];
            const jan1Indices = [];

            let idx = 0;
            for (let d = new Date(firstDate); d <= lastDate; d.setDate(d.getDate() + 1)) {
                const key = d.toISOString().slice(0, 10);
                labels.push(formatDateShort(d));
                dates.push(new Date(d));
                weights.push(byDay[key] !== undefined ? byDay[key] : 0);
                if (d.getMonth() === 0 && d.getDate() === 1) jan1Indices.push(idx);
                idx++;
            }

            let vAxisIndex = -1;
            for (let i = 0; i < dates.length; i++) {
                if (dates[i] >= V_AXIS_DATE) { vAxisIndex = i; break; }
            }
            if (vAxisIndex === -1) vAxisIndex = 0;

            const yearSegments = [];
            let curYear = null, startIdx = 0;
            for (let i = 0; i < dates.length; i++) {
                const y = dates[i].getFullYear();
                if (curYear === null) { curYear = y; startIdx = i; }
                else if (y !== curYear) {
                    yearSegments.push({ year: curYear, startIdx: startIdx, endIdx: i - 1 });
                    curYear = y;
                    startIdx = i;
                }
            }
            if (curYear !== null) yearSegments.push({ year: curYear, startIdx: startIdx, endIdx: dates.length - 1 });

            const monthSegments = [];
            let prevKey = null, segStart = 0;
            for (let i = 0; i < dates.length; i++) {
                const d = dates[i];
                const key = d.getFullYear() * 100 + d.getMonth();
                if (prevKey === null) { prevKey = key; segStart = i; }
                else if (key !== prevKey) {
                    monthSegments.push({
                        year: dates[segStart].getFullYear(),
                        month: dates[segStart].getMonth(),
                        startIdx: segStart,
                        endIdx: i - 1
                    });
                    prevKey = key;
                    segStart = i;
                }
            }
            if (prevKey !== null) {
                monthSegments.push({
                    year: dates[segStart].getFullYear(),
                    month: dates[segStart].getMonth(),
                    startIdx: segStart,
                    endIdx: dates.length - 1
                });
            }

            return { labels, weights, jan1Indices, yearSegments, monthSegments, vAxisIndex };
        }

        function buildCompareChartData(entries) {
            const byYear = {};
            entries.forEach(e => {
                const y = e.date.getFullYear();
                if (!byYear[y]) byYear[y] = [];
                byYear[y].push(e);
            });

            const years = Object.keys(byYear).map(Number).sort();
            const datasets = [];
            const pt = getPointRadiusForScreen();

            years.forEach((year) => {
                const color = colorForYear(year);
                const points = byYear[year].map(e => {
                    const startOfYear = new Date(year, 0, 1);
                    const dayOfYear = Math.floor((e.date - startOfYear) / 86400000) + 1;
                    return { x: dayOfYear, y: e.weight };
                });
                points.sort((a, b) => a.x - b.x);
                datasets.push({
                    label: String(year),
                    data: points,
                    borderColor: color,
                    backgroundColor: color,
                    showLine: false,
                    pointRadius: pt.r,
                    pointHoverRadius: pt.hr,
                    pointBackgroundColor: color,
                    parsing: false
                });
            });

            return { datasets, years };
        }

        // Иконка кнопки: показываем ПРОТИВОПОЛОЖНЫЙ тип
        function updateTypeToggleVisibility() {
            const btn = document.getElementById('typeToggle');
            if (!btn) return;

            if (COMPARE_MODE) {
                // Для сравнения: line (со линией) ↔ scatter (только точки)
                // Иконка bars не очень подходит, используем те же две:
                //   COMPARE_KIND === 'line'    → показываем iconLine (переключение в line НЕ имеет смысла,
                //                                            но фактически смысл — «точки без линии», иконка bars)
                // Оставим так: если сейчас 'line' → показываем iconBars (намёк на «упростить до точек»)
                //               если сейчас 'scatter' → показываем iconLine
                document.getElementById('iconBars').style.display = COMPARE_KIND === 'line' ? 'block' : 'none';
                document.getElementById('iconLine').style.display = COMPARE_KIND === 'scatter' ? 'block' : 'none';
            } else {
                // Для обычных периодов: bar ↔ line
                // Показываем ПРОТИВОПОЛОЖНУЮ иконку
                document.getElementById('iconBars').style.display = CHART_KIND === 'line' ? 'block' : 'none';
                document.getElementById('iconLine').style.display = CHART_KIND === 'bar' ? 'block' : 'none';
            }
        }

        function createNormalChart(entries) {
            if (chart) { chart.destroy(); chart = null; }
            const ctx = document.getElementById('weightChart').getContext('2d');
            const extendToMaxDate = (CURRENT_PERIOD === 'all');
            const { labels, weights, jan1Indices, yearSegments, monthSegments, vAxisIndex } =
                buildNormalChartData(entries, extendToMaxDate);
            const barColors = weights.map(w => w > 0 ? colorForWeight(w) : 'transparent');

            const isSmall = window.innerWidth < 600;
            const isLandscapePhone = window.innerWidth < 900 && window.innerWidth > window.innerHeight;
            const padTopBase = isLandscapePhone ? 8 : (isSmall ? 10 : 12);
            const padTop = padTopBase + 14;
            const padBottom = getPadBottom();

            const showMonthGrid = (CURRENT_PERIOD === '6m' || CURRENT_PERIOD === '1y' ||
                                   CURRENT_PERIOD === '3m' || CURRENT_PERIOD === '1m');

            const barParams = getBarParams(CURRENT_PERIOD);

            // Для линейного режима заменяем 0 на null — Chart.js разрывает линию в этих местах
            const lineData = weights.map(w => w > 0 ? w : null);

            const dataset = (CHART_KIND === 'bar')
                ? {
                    label: 'Масса тела (кг)',
                    data: weights,
                    backgroundColor: barColors,
                    borderColor: barColors,
                    borderWidth: 0,
                    borderRadius: 0,
                    barPercentage: barParams.barPercentage,
                    categoryPercentage: barParams.categoryPercentage
                }
                : {
                    label: 'Масса тела (кг)',
                    data: lineData,
                    backgroundColor: 'transparent',
                    borderColor: '#4db8ff',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    pointHoverRadius: 3,
                    tension: 0.25,
                    spanGaps: false
                };

            chart = new Chart(ctx, {
                type: CHART_KIND,
                plugins: [monthGridPlugin, yAxisLinePlugin, yearLinesPlugin, minMaxLinesPlugin, monthLabelsPlugin, yearLabelsPlugin, weightLegendPlugin],
                data: {
                    labels: labels,
                    datasets: [dataset]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 500, easing: 'easeOutQuart' },
                    interaction: { mode: 'index', intersect: false },
                    layout: { padding: { top: padTop, bottom: padBottom, left: 10, right: 10 } },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(44, 62, 80, 0.95)',
                            titleFont: { size: 11 },
                            bodyFont: { size: 12 },
                            padding: 10,
                            cornerRadius: 8,
                            callbacks: {
                                label: function(context) {
                                    const v = context.parsed.y;
                                    if (v === 0 || v === null || v === undefined) return 'Нет данных';
                                    return 'Масса: ' + v.toFixed(1) + ' кг';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: 69, max: 76,
                            title: {
                                display: true,
                                text: 'Масса тела (кг)',
                                color: '#c8d8e8',
                                font: { size: 10 },
                                padding: { top: 0, bottom: 2 }
                            },
                            grid: { color: Y_GRID_COLOR },
                            ticks: {
                                color: '#c8d8e8',
                                stepSize: 1,
                                font: { size: 10 },
                                padding: 4
                            },
                            afterFit(scale) { scale.width += 6; }
                        },
                        x: {
                            title: { display: false },
                            grid: { display: false },
                            ticks: { display: false }
                        }
                    }
                }
            });

            chart._compareMode = false;
            chart._showMonthGrid = showMonthGrid;
            chart._jan1Indices = jan1Indices;
            chart._yearSegments = yearSegments;
            chart._monthSegments = monthSegments;
            chart._vAxisIndex = vAxisIndex;
            chart._showWeightLegend = true;
            chart._legendWeights = entries.map(e => e.weight);

            setTimeout(() => {
                if (!chart) return;
                const area = chart.chartArea;
                const n = chart.data.labels.length;
                if (!area || n === 0) return;
                const catWidth = (area.right - area.left) / n;
                const barW = catWidth * barParams.categoryPercentage * barParams.barPercentage;
                chart._barWidthHalf = barW / 2;
                chart.draw();
            }, 0);

            let maxW = null, minW = null;
            entries.forEach(e => {
                if (maxW === null || e.weight > maxW) maxW = e.weight;
                if (minW === null || e.weight < minW) minW = e.weight;
            });
            chart._maxWeight = maxW;
            chart._minWeight = minW;

            window.weightChartInstance = chart;
            updateTypeToggleVisibility();
        }

        function createCompareChart(entries) {
            if (chart) { chart.destroy(); chart = null; }
            const ctx = document.getElementById('weightChart').getContext('2d');
            const { datasets } = buildCompareChartData(entries);

            // Для сравнения: 'line' — точки + линия; 'scatter' — только точки
            if (COMPARE_KIND === 'line') {
                datasets.forEach(ds => { ds.showLine = true; });
            } else {
                datasets.forEach(ds => { ds.showLine = false; });
            }

            const isSmall = window.innerWidth < 600;
            const isLandscapePhone = window.innerWidth < 900 && window.innerWidth > window.innerHeight;
            const padTop = isLandscapePhone ? 8 : (isSmall ? 10 : 12);
            const padBottom = getPadBottom();

            const MONTH_MID_DAY = [15, 45, 74, 105, 135, 166, 196, 227, 258, 288, 319, 349];

            const compareMonthLabelsPlugin = {
                id: 'compareMonths',
                afterDraw(c) {
                    const { ctx, chartArea, scales } = c;
                    if (!chartArea) return;
                    const xScale = scales.x;
                    const fontPx = isSmall ? 8 : 10;
                    ctx.save();
                    ctx.font = `bold ${fontPx}px Inter, sans-serif`;
                    ctx.fillStyle = 'rgba(200, 216, 232, 0.75)';
                    for (let m = 0; m < 12; m++) {
                        const x = xScale.getPixelForValue(MONTH_MID_DAY[m]);
                        if (x >= chartArea.left && x <= chartArea.right) {
                            ctx.save();
                            ctx.translate(x, chartArea.bottom + 5);
                            ctx.rotate(-Math.PI / 2);
                            ctx.textAlign = 'right';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(MONTHS_RU[m], 0, 0);
                            ctx.restore();
                        }
                    }
                    ctx.restore();
                }
            };

            chart = new Chart(ctx, {
                type: COMPARE_KIND === 'line' ? 'line' : 'scatter',
                plugins: [compareMonthGridPlugin, compareMonthLabelsPlugin],
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 500, easing: 'easeOutQuart' },
                    interaction: { mode: 'nearest', intersect: false },
                    layout: { padding: { top: padTop, bottom: padBottom, left: 10, right: 10 } },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#e8eef5',
                                font: { size: 9 },
                                boxWidth: 9,
                                boxHeight: 9,
                                padding: 16,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(44, 62, 80, 0.95)',
                            titleFont: { size: 11 },
                            bodyFont: { size: 12 },
                            padding: 10,
                            cornerRadius: 8,
                            callbacks: {
                                title: function(items) {
                                    if (!items.length) return '';
                                    const dayOfYear = items[0].parsed.x;
                                    const d = new Date(2024, 0, dayOfYear);
                                    return d.getDate() + ' ' + MONTHS_RU_FULL[d.getMonth()].toLowerCase();
                                },
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + ' кг';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: 69, max: 76,
                            title: {
                                display: true,
                                text: 'Масса тела (кг)',
                                color: '#c8d8e8',
                                font: { size: 10 },
                                padding: { top: 0, bottom: 2 }
                            },
                            grid: { color: Y_GRID_COLOR },
                            ticks: {
                                color: '#c8d8e8',
                                stepSize: 1,
                                font: { size: 10 },
                                padding: 4
                            },
                            afterFit(scale) { scale.width += 6; }
                        },
                        x: {
                            type: 'linear',
                            min: 0,
                            max: 366,
                            title: { display: false },
                            grid: { display: false },
                            ticks: { display: false }
                        }
                    }
                }
            });

            chart._compareMode = true;

            setTimeout(() => {
                if (!chart) return;
                const area = chart.chartArea;
                if (!area) return;
                const stepPx = (area.right - area.left) / 366;
                chart._stepHalf = stepPx / 2;
                chart.draw();
            }, 0);

            window.weightChartInstance = chart;
            updateTypeToggleVisibility();
        }

        function playTransition(mode, direction, callback) {
            const inner = document.getElementById('chartInner');
            if (!inner) { callback(); return; }

            inner.classList.remove(
                'slide-out-left', 'slide-out-right',
                'slide-in-from-right', 'slide-in-from-left', 'slide-in-enter',
                'zoom-out', 'zoom-in-prep', 'zoom-in-enter'
            );

            if (direction === 'same') {
                callback();
                return;
            }

            if (mode === 'zoom') {
                // Зум: правый край закреплён, диаграмма сжимается/растягивается по X
                inner.classList.add('zoom-out');

                setTimeout(() => {
                    callback();

                    inner.classList.remove('zoom-out');
                    inner.classList.add('zoom-in-prep');
                    void inner.offsetWidth;

                    inner.classList.remove('zoom-in-prep');
                    inner.classList.add('zoom-in-enter');

                    setTimeout(() => {
                        inner.classList.remove('zoom-in-enter');
                        switchInProgress = false;
                    }, 340);
                }, 220);
            } else {
                const outClass = direction === 'forward' ? 'slide-out-left' : 'slide-out-right';
                const inClass  = direction === 'forward' ? 'slide-in-from-right' : 'slide-in-from-left';

                inner.classList.add(outClass);

                setTimeout(() => {
                    callback();

                    inner.classList.remove(outClass);
                    inner.classList.add(inClass);
                    void inner.offsetWidth;

                    inner.classList.remove(inClass);
                    inner.classList.add('slide-in-enter');

                    setTimeout(() => {
                        inner.classList.remove('slide-in-enter');
                        switchInProgress = false;
                    }, 240);
                }, 200);
            }
        }

        function redraw() {
            if (COMPARE_MODE) {
                const allEntries = filterByPeriod(ALL_ENTRIES, 'all');
                updateStats(allEntries);
                createCompareChart(allEntries);
            } else {
                const filtered = filterByPeriod(ALL_ENTRIES, CURRENT_PERIOD);
                updateStats(filtered);
                createNormalChart(filtered);
            }
        }

        async function loadData() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const dashboardEl = document.getElementById('dashboard');

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Ошибка сети при загрузке данных');
                const csvText = await response.text();
                const rows = parseCSV(csvText).map(r => r.map(c => c.trim()));
                if (rows.length < 2) throw new Error('В таблице недостаточно данных.');

                let headerRowIndex = 0, dateIndex = -1, weightIndex = -1;
                for (let i = 0; i < Math.min(5, rows.length); i++) {
                    const headers = rows[i].map(h => h.toLowerCase());
                    const d = headers.findIndex(h => h.includes('дата') || h.includes('date'));
                    const w = headers.findIndex(h =>
                        h.includes('масса') || h.includes('вес') ||
                        h.includes('weight') || h.includes('mass')
                    );
                    if (d !== -1 && w !== -1) { headerRowIndex = i; dateIndex = d; weightIndex = w; break; }
                }
                if (dateIndex === -1 || weightIndex === -1) { dateIndex = 0; weightIndex = 1; headerRowIndex = 0; }

                let entries = [];
                for (let i = headerRowIndex + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length <= Math.max(dateIndex, weightIndex)) continue;
                    const dateStr = row[dateIndex];
                    const weightStr = row[weightIndex];
                    if (!dateStr) continue;

                    let date = null, match;
                    if ((match = dateStr.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2})$/)))
                        date = new Date(2000 + parseInt(match[3]), parseInt(match[2]) - 1, parseInt(match[1]));
                    else if ((match = dateStr.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/)))
                        date = new Date(parseInt(match[3]), parseInt(match[2]) - 1, parseInt(match[1]));
                    else if ((match = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))
                        date = new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
                    else date = new Date(dateStr);
                    if (!date || isNaN(date.getTime())) continue;
                    date.setHours(0, 0, 0, 0);

                    let weight = 0;
                    if (weightStr) {
                        const normalized = weightStr.replace(/\s/g, '').replace(',', '.');
                        const parsed = parseFloat(normalized);
                        if (!isNaN(parsed)) weight = parsed;
                    }
                    if (weight <= 0) continue;

                    entries.push({ date, weight });
                }

                if (entries.length === 0) throw new Error('Не удалось извлечь корректные данные.');

                entries = entries.filter(e => e.date <= MAX_DATE);

                if (entries.length === 0) throw new Error('После фильтрации по дате 31.12.2026 данные отсутствуют.');

                entries.sort((a, b) => a.date - b.date);
                ALL_ENTRIES = entries;

                LAST_BREAKPOINT = currentBreakpoint();

                loadingEl.style.display = 'none';
                dashboardEl.style.display = 'flex';
                redraw();

            } catch (error) {
                console.error('Ошибка:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = 'Не удалось загрузить данные: ' + error.message;
            }
        }

        function setActiveTab(tabKey, opts) {
            opts = opts || {};
            let noAnimation = !!opts.noAnimation;
            const forcedDirection = opts.direction;

            if (switchInProgress && !noAnimation) {
                noAnimation = true;
            }

            const oldKey = COMPARE_MODE ? 'compare' : CURRENT_PERIOD;

            let direction = 'same';
            if (forcedDirection) {
                direction = forcedDirection;
            } else if (oldKey !== tabKey) {
                const oldIdx = VISUAL_ORDER.indexOf(oldKey);
                const newIdx = VISUAL_ORDER.indexOf(tabKey);
                if (oldIdx !== -1 && newIdx !== -1) {
                    direction = newIdx > oldIdx ? 'backward' : 'forward';
                }
            }

            const transitionMode = (oldKey === 'compare' || tabKey === 'compare') ? 'slide' : 'zoom';

            if (tabKey === 'compare') {
                COMPARE_MODE = true;
                CURRENT_PERIOD = 'all';
                document.querySelectorAll('.period-btn[data-period]').forEach(b => b.classList.remove('active'));
                document.getElementById('compareBtn').classList.add('active');
            } else {
                COMPARE_MODE = false;
                CURRENT_PERIOD = tabKey;
                document.querySelectorAll('.period-btn[data-period]').forEach(b => {
                    b.classList.toggle('active', b.dataset.period === tabKey);
                });
                document.getElementById('compareBtn').classList.remove('active');
            }

            if (COMPARE_MODE) {
                const allEntries = filterByPeriod(ALL_ENTRIES, 'all');
                updateStats(allEntries);
            } else {
                const filtered = filterByPeriod(ALL_ENTRIES, CURRENT_PERIOD);
                updateStats(filtered);
            }

            if (noAnimation) {
                redraw();
                return;
            }

            switchInProgress = true;
            playTransition(transitionMode, direction, () => {
                if (COMPARE_MODE) {
                    const allEntries = filterByPeriod(ALL_ENTRIES, 'all');
                    createCompareChart(allEntries);
                } else {
                    const filtered = filterByPeriod(ALL_ENTRIES, CURRENT_PERIOD);
                    createNormalChart(filtered);
                }
            });
        }

        function setActivePeriod(period) {
            setActiveTab(period);
        }

        function setupPeriodButtons() {
            document.querySelectorAll('.period-btn[data-period]').forEach(btn => {
                btn.addEventListener('click', () => {
                    setActiveTab(btn.dataset.period);
                });
            });
            document.getElementById('compareBtn').addEventListener('click', () => {
                if (COMPARE_MODE) {
                    setActiveTab('all');
                } else {
                    setActiveTab('compare');
                }
            });
        }

        function setupWheel() {
            const container = document.getElementById('chartContainer');
            if (!container) return;

            const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
            if (isTouch) return;

            const STEP_THRESHOLD = 40;
            const IDLE_TIMEOUT = 250;

            container.addEventListener('wheel', (e) => {
                e.preventDefault();

                wheelAccum += e.deltaY;

                if (wheelTimer) clearTimeout(wheelTimer);
                wheelTimer = setTimeout(() => {
                    wheelAccum = 0;
                    wheelTimer = null;
                }, IDLE_TIMEOUT);

                if (Math.abs(wheelAccum) < STEP_THRESHOLD) return;
                if (switchInProgress) return;

                const deltaSign = wheelAccum > 0 ? 1 : -1;
                wheelAccum = 0;

                const currentKey = COMPARE_MODE ? 'compare' : CURRENT_PERIOD;
                let idx = SWIPE_ORDER.indexOf(currentKey);
                if (idx === -1) idx = SWIPE_ORDER.length - 1;

                const dir = deltaSign < 0 ? 1 : -1;
                const nextIdx = (idx + dir + SWIPE_ORDER.length) % SWIPE_ORDER.length;

                const animDirection = deltaSign < 0 ? 'forward' : 'backward';

                setActiveTab(SWIPE_ORDER[nextIdx], { direction: animDirection });
            }, { passive: false });
        }

        function setupSwipe() {
            const container = document.getElementById('chartContainer');
            if (!container) return;

            const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
            if (!isTouch) return;

            let startX = 0;
            let startY = 0;
            let tracking = false;
            const THRESHOLD = 50;
            const VERTICAL_DOMINANCE = 1.2;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) { tracking = false; return; }
                const t = e.touches[0];
                startX = t.clientX;
                startY = t.clientY;
                tracking = true;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (!tracking) return;
                tracking = false;
                if (!e.changedTouches || e.changedTouches.length === 0) return;
                const t = e.changedTouches[0];
                const dx = t.clientX - startX;
                const dy = t.clientY - startY;

                if (Math.abs(dx) < THRESHOLD) return;
                if (Math.abs(dy) > Math.abs(dx) * VERTICAL_DOMINANCE) return;

                const currentKey = COMPARE_MODE ? 'compare' : CURRENT_PERIOD;
                let idx = SWIPE_ORDER.indexOf(currentKey);
                if (idx === -1) idx = SWIPE_ORDER.length - 1;

                const dir = dx < 0 ? 1 : -1;
                const nextIdx = (idx + dir + SWIPE_ORDER.length) % SWIPE_ORDER.length;

                const animDirection = dx < 0 ? 'forward' : 'backward';

                setActiveTab(SWIPE_ORDER[nextIdx], { direction: animDirection });
            }, { passive: true });

            container.addEventListener('touchcancel', () => { tracking = false; }, { passive: true });
        }

        function setupTypeToggle() {
            const btn = document.getElementById('typeToggle');
            if (!btn) return;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (COMPARE_MODE) {
                    COMPARE_KIND = (COMPARE_KIND === 'line') ? 'scatter' : 'line';
                } else {
                    CHART_KIND = (CHART_KIND === 'bar') ? 'line' : 'bar';
                }
                redraw();
            });
        }

        let chartFullscreen = false;
        let lastTouchTime = 0;

        function enterFullscreen() {
            if (chartFullscreen) return;
            chartFullscreen = true;
            document.documentElement.classList.add('chart-fullscreen');
            document.body.classList.add('chart-fullscreen');
            if (chart) chart.resize();
        }

        function exitFullscreen() {
            if (!chartFullscreen) return;
            chartFullscreen = false;
            document.documentElement.classList.remove('chart-fullscreen');
            document.body.classList.remove('chart-fullscreen');
            if (chart) chart.resize();
        }

        function toggleFullscreen() {
            if (chartFullscreen) exitFullscreen();
            else enterFullscreen();
        }

        function setupFullscreenToggle() {
            const container = document.getElementById('chartContainer');
            if (!container) return;

            const DBL_TAP_MS = 300;
            const DBL_TAP_DIST = 30;

            let lastTapTime = 0;
            let lastTapX = 0;
            let lastTapY = 0;
            let movedSinceTap = false;
            let startX = 0, startY = 0;

            container.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                const t = e.touches[0];
                startX = t.clientX;
                startY = t.clientY;
                movedSinceTap = false;
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length !== 1) return;
                const t = e.touches[0];
                const dx = t.clientX - startX;
                const dy = t.clientY - startY;
                if (Math.abs(dx) > 15 || Math.abs(dy) > 15) movedSinceTap = true;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (movedSinceTap) return;
                if (!e.changedTouches || e.changedTouches.length === 0) return;
                const t = e.changedTouches[0];
                const now = Date.now();
                const dx = t.clientX - lastTapX;
                const dy = t.clientY - lastTapY;

                lastTouchTime = now;

                if (now - lastTapTime < DBL_TAP_MS &&
                    Math.abs(dx) < DBL_TAP_DIST &&
                    Math.abs(dy) < DBL_TAP_DIST) {
                    e.preventDefault();
                    toggleFullscreen();
                    lastTapTime = 0;
                } else {
                    lastTapTime = now;
                    lastTapX = t.clientX;
                    lastTapY = t.clientY;
                }
            }, { passive: false });

            container.addEventListener('dblclick', (e) => {
                if (Date.now() - lastTouchTime < 500) return;
                e.preventDefault();
                toggleFullscreen();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && chartFullscreen) exitFullscreen();
            });
        }

        window.addEventListener('resize', () => {
            const bp = currentBreakpoint();
            if (bp !== LAST_BREAKPOINT) {
                LAST_BREAKPOINT = bp;
                setActiveTab(COMPARE_MODE ? 'compare' : CURRENT_PERIOD, { noAnimation: true });
            } else if (chart) {
                chart.resize();
            }
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                const bp = currentBreakpoint();
                if (bp !== LAST_BREAKPOINT) {
                    LAST_BREAKPOINT = bp;
                    setActiveTab(COMPARE_MODE ? 'compare' : CURRENT_PERIOD, { noAnimation: true });
                } else if (chart) {
                    chart.resize();
                }
            }, 200);
        });

        window.onload = () => {
            setupPeriodButtons();
            setupSwipe();
            setupWheel();
            setupTypeToggle();
            setupFullscreenToggle();
            LAST_BREAKPOINT = currentBreakpoint();
            loadData();
        };
    </script>
</body>
</html>
