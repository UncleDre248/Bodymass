<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Динамика массы тела</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a1018">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* без прокрутки ни по X, ни по Y */
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f1720;
            color: #e8eef5;
            display: flex;
            padding: 12px;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a2332;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.5);
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 0 0 8px;
            flex-shrink: 0;
            align-items: stretch;
        }
        .stat-item {
            background: linear-gradient(135deg, #1e2a3a 0%, #243447 100%);
            padding: 8px 6px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.25s, box-shadow 0.25s;
            opacity: 0;
            animation: fadeInUp 0.5s forwards;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .stat-item:nth-child(1) { animation-delay: 0.05s; }
        .stat-item:nth-child(2) { animation-delay: 0.10s; }
        .stat-item:nth-child(3) { animation-delay: 0.15s; }
        .stat-item:nth-child(4) { animation-delay: 0.20s; }
        .stat-item:nth-child(5) { animation-delay: 0.25s; }
        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        }
        .stat-item h3 {
            margin: 0 0 3px;
            font-size: 9px;
            color: #8aa0b4;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stat-item p {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #4db8ff;
            white-space: nowrap;
            line-height: 1.1;
        }
        .stat-item p.positive { color: #e74c3c; }
        .stat-item p.negative { color: #27ae60; }
        .stat-item p.neutral  { color: #4db8ff; }
        #totalChange,
        #swingValue {
            color: #ffffff !important;
        }
        .stat-item p small {
            display: block;
            font-size: 9px;
            font-weight: 500;
            color: #8aa0b4;
            margin-top: 2px;
            white-space: nowrap;
            line-height: 1.1;
        }
        /* Стрелки потолще */
        .trend-arrow {
            display: inline-block;
            font-size: 22px;
            margin-left: 4px;
            font-weight: 900;
            vertical-align: middle;
            line-height: 1;
        }
        .trend-up { color: #e74c3c; }
        .trend-down { color: #27ae60; }
        .trend-same { color: #8aa0b4; }

        /* ============ ПАНЕЛЬ КНОПОК ПЕРИОДА ============ */
        .period-bar {
            display: flex;
            gap: 6px;
            margin: 0 0 8px;
            flex-shrink: 0;
            align-items: stretch;
        }
        .period-btn {
            background: #0a1018;
            color: #c8d8e8;
            border: 1px solid #2c3a4f;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
            white-space: nowrap;
            user-select: none;
            width: 90px;
            flex: 0 0 90px;
            text-align: center;
            box-sizing: border-box;
        }
        .period-btn:hover { background: #131c28; }
        .period-btn.active {
            background: #4db8ff;
            color: #001236;
            border-color: #4db8ff;
        }
        .period-btn.compare {
            margin-left: auto;
            width: auto;
            flex: 0 0 auto;
            min-width: 140px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            flex: 1;
            /* Диаграмма растягивается, но не выходит за пределы экрана */
            min-height: 200px;
            background-color: #0a1018;
            border-radius: 12px;
            padding: 6px;
            min-width: 0;
        }
        #loading, #error {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #8aa0b4;
            margin: auto;
        }
        #error {
            color: #e74c3c;
            display: none;
        }
        #dashboard {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1100px) {
            .stat-item p { font-size: 15px; }
            .trend-arrow { font-size: 20px; }
        }
        @media (max-width: 900px) {
            .stats { grid-template-columns: repeat(5, 1fr); gap: 7px; margin-bottom: 6px; }
            .stat-item p { font-size: 14px; }
            .stat-item h3 { font-size: 8px; }
            .stat-item p small { font-size: 8px; }
            .trend-arrow { font-size: 18px; }
            .period-btn { width: 75px; flex: 0 0 75px; font-size: 11px; padding: 5px 6px; }
            .period-btn.compare { min-width: 120px; font-size: 11px; }
        }
        @media (max-width: 600px) {
            body { padding: 6px; }
            .container { padding: 8px; border-radius: 12px; }
            .stats { grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 6px; }
            .stat-item { padding: 6px 3px; border-radius: 8px; }
            .stat-item h3 { font-size: 7px; letter-spacing: 0.3px; margin-bottom: 2px; }
            .stat-item p { font-size: 12px; }
            .stat-item p small { font-size: 7px; }
            .trend-arrow { font-size: 15px; margin-left: 2px; }
            .period-bar { gap: 3px; margin-bottom: 5px; }
            .period-btn { width: 62px; flex: 0 0 62px; font-size: 10px; padding: 4px 5px; border-radius: 6px; }
            .period-btn.compare { min-width: 100px; font-size: 10px; }
            .chart-container { padding: 4px; }
        }
        @media (max-width: 420px) {
            .stat-item h3 { display: none; }
            .period-btn { width: 54px; flex: 0 0 54px; font-size: 9px; padding: 4px 4px; }
            .period-btn.compare { min-width: 90px; font-size: 9px; }
            .trend-arrow { font-size: 13px; }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            .stats { grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 4px; }
            .stat-item { padding: 5px 3px; }
            .stat-item h3 { font-size: 7px; margin-bottom: 1px; }
            .stat-item p { font-size: 12px; }
            .stat-item p small { font-size: 7px; }
            .period-btn { width: 75px; flex: 0 0 75px; font-size: 10px; padding: 4px 6px; }
            .period-btn.compare { min-width: 120px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">Загрузка данных...</div>
        <div id="error"></div>

        <div id="dashboard">
            <div class="stats">
                <div class="stat-item">
                    <h3>Текущая масса</h3>
                    <p id="currentWeight">--</p>
                </div>
                <div class="stat-item">
                    <h3>Максимум</h3>
                    <p id="maxWeight">--</p>
                </div>
                <div class="stat-item">
                    <h3>Минимум</h3>
                    <p id="minWeight">--</p>
                </div>
                <div class="stat-item">
                    <h3>Изменение</h3>
                    <p id="totalChange">--</p>
                </div>
                <div class="stat-item">
                    <h3>Колебание</h3>
                    <p id="swingValue">--</p>
                </div>
            </div>

            <div class="period-bar" id="periodBar">
                <button class="period-btn" data-period="1m">1 месяц</button>
                <button class="period-btn" data-period="3m">3 месяца</button>
                <button class="period-btn" data-period="6m">6 месяцев</button>
                <button class="period-btn" data-period="1y">1 год</button>
                <button class="period-btn active" data-period="all">Всё время</button>
                <button class="period-btn compare" id="compareBtn">Сравнение по годам</button>
            </div>

            <div class="chart-container" id="chartContainer">
                <canvas id="weightChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCxUQ2eWCaI8HwAvEFRVc1VzXgjun4Gkx5K6vk3x7dHyKaaq_GHatCTUMkh2vb2EYIWCtVUmnLnPiE/pub?output=csv';

        const MONTHS_RU = [
            'Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн',
            'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'
        ];
        const MONTHS_RU_FULL = [
            'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
        ];

        const RANGE_COLORS = {
            69: '#1F9E1F',
            70: '#66FF66',
            71: '#00B0F0',
            72: '#4472C4',
            73: '#7030A0',
            74: '#CC0099',
            75: '#FF0000',
            76: '#B20000'
        };

        const YEAR_COLORS = [
            '#4db8ff', '#f39c12', '#e74c3c', '#27ae60', '#9b59b6', '#00cec9', '#e67e22'
        ];

        const V_AXIS_DATE = new Date(2024, 7, 1);
        const MAX_DATE = new Date(2026, 11, 31, 23, 59, 59);

        let ALL_ENTRIES = [];
        let CURRENT_PERIOD = 'all';
        let COMPARE_MODE = false;
        let chart = null;

        function colorForWeight(w) {
            const key = Math.floor(w);
            if (RANGE_COLORS[key] !== undefined) return RANGE_COLORS[key];
            if (key < 69) return RANGE_COLORS[69];
            return RANGE_COLORS[76];
        }

        function hexToRgba(hex, alpha) {
            const h = hex.replace('#', '');
            const r = parseInt(h.substring(0, 2), 16);
            const g = parseInt(h.substring(2, 4), 16);
            const b = parseInt(h.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                const next = text[i + 1];
                if (inQuotes) {
                    if (ch === '"' && next === '"') { cell += '"'; i++; }
                    else if (ch === '"') { inQuotes = false; }
                    else { cell += ch; }
                } else {
                    if (ch === '"') { inQuotes = true; }
                    else if (ch === ',') { row.push(cell); cell = ''; }
                    else if (ch === '\n' || ch === '\r') {
                        if (ch === '\r' && next === '\n') i++;
                        row.push(cell);
                        rows.push(row);
                        row = [];
                        cell = '';
                    } else { cell += ch; }
                }
            }
            if (cell.length > 0 || row.length > 0) { row.push(cell); rows.push(row); }
            return rows.filter(r => r.some(c => c.trim() !== ''));
        }

        function formatDateShort(date) {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const y = String(date.getFullYear()).slice(-2);
            return `${d}.${m}.${y}`;
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function getBarParams(period) {
            if (period === '1m' || period === '3m' || period === '6m') {
                return { barPercentage: 0.85, categoryPercentage: 0.95 };
            }
            if (period === '1y') {
                return { barPercentage: 0.97, categoryPercentage: 1.0 };
            }
            return { barPercentage: 1.0, categoryPercentage: 1.0 };
        }

        const yAxisLinePlugin = {
            id: 'yAxisLine',
            beforeDatasetsDraw(chart) {
                if (chart._compareMode) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (chart._vAxisIndex == null) return;
                const xScale = scales.x;
                const x = xScale.getPixelForValue(chart._vAxisIndex);
                if (x < chartArea.left || x > chartArea.right) return;
                const halfBar = chart._barWidthHalf || 0;
                const xLeft = x - halfBar;
                ctx.save();
                ctx.beginPath();
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.moveTo(xLeft, chartArea.top);
                ctx.lineTo(xLeft, chartArea.bottom);
                ctx.stroke();
                ctx.restore();
            }
        };

        const yearLinesPlugin = {
            id: 'yearLines',
            beforeDatasetsDraw(chart) {
                if (chart._compareMode) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (!chart._jan1Indices || chart._jan1Indices.length === 0) return;
                const xScale = scales.x;
                ctx.save();
                ctx.setLineDash([]);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(200, 216, 232, 0.25)';
                chart._jan1Indices.forEach(idx => {
                    const x = xScale.getPixelForValue(idx);
                    if (x >= chartArea.left && x <= chartArea.right) {
                        ctx.beginPath();
                        ctx.moveTo(x, chartArea.top);
                        ctx.lineTo(x, chartArea.bottom);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        };

        const monthGridPlugin = {
            id: 'monthGrid',
            beforeDatasetsDraw(chart) {
                if (chart._compareMode) return;
                if (!chart._showMonthGrid) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (!chart._monthSegments) return;
                const xScale = scales.x;
                ctx.save();
                ctx.setLineDash([]);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
                chart._monthSegments.forEach(seg => {
                    const x = xScale.getPixelForValue(seg.startIdx);
                    if (x > chartArea.left && x <= chartArea.right) {
                        ctx.beginPath();
                        ctx.moveTo(x, chartArea.top);
                        ctx.lineTo(x, chartArea.bottom);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        };

        // Вертикальная сетка по месяцам для режима сравнения по годам
        const compareMonthGridPlugin = {
            id: 'compareMonthGrid',
            beforeDatasetsDraw(chart) {
                if (!chart._compareMode) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                const xScale = scales.x;
                // Первые числа месяцев (в днях года, для невисокосного года):
                // 1 янв, 1 фев, 1 мар, 1 апр, ...
                const MONTH_START_DAY = [1, 32, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
                ctx.save();
                ctx.setLineDash([]);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                MONTH_START_DAY.forEach(day => {
                    const x = xScale.getPixelForValue(day);
                    if (x > chartArea.left && x <= chartArea.right) {
                        ctx.beginPath();
                        ctx.moveTo(x, chartArea.top);
                        ctx.lineTo(x, chartArea.bottom);
                        ctx.stroke();
                    }
                });
                ctx.restore();
            }
        };

        const minMaxLinesPlugin = {
            id: 'minMaxLines',
            afterDatasetsDraw(chart) {
                if (chart._compareMode) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (chart._maxWeight == null || chart._minWeight == null) return;
                const yScale = scales.y;
                const yMax = yScale.getPixelForValue(chart._maxWeight);
                const yMin = yScale.getPixelForValue(chart._minWeight);
                ctx.save();
                ctx.setLineDash([3, 3]);
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = hexToRgba(colorForWeight(chart._maxWeight), 0.5);
                ctx.beginPath();
                ctx.moveTo(chartArea.left, yMax);
                ctx.lineTo(chartArea.right, yMax);
                ctx.stroke();
                ctx.strokeStyle = hexToRgba(colorForWeight(chart._minWeight), 0.5);
                ctx.beginPath();
                ctx.moveTo(chartArea.left, yMin);
                ctx.lineTo(chartArea.right, yMin);
                ctx.stroke();
                ctx.restore();
            },
            afterDraw(chart) {
                if (chart._compareMode) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (chart._maxWeight == null || chart._minWeight == null) return;
                const yScale = scales.y;
                const chartWidth = chartArea.right - chartArea.left;
                const isSmall = chartWidth < 400;
                const fontPx = isSmall ? 8 : 10;
                const pw0 = isSmall ? 8 : 10;
                const ph = isSmall ? 9.5 : 11;
                const drawBadge = (weight, color) => {
                    const y = yScale.getPixelForValue(weight);
                    const x = chartArea.left - 4;
                    ctx.save();
                    ctx.font = `bold ${fontPx}px Inter, sans-serif`;
                    const text = weight.toFixed(1);
                    const tw = ctx.measureText(text).width;
                    const pw = tw + pw0;
                    const bx = x - pw - 2;
                    const by = y - ph / 2;
                    ctx.fillStyle = color;
                    roundRect(ctx, bx, by, pw, ph, 3);
                    ctx.fill();
                    ctx.fillStyle = '#001236';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, bx + pw / 2, by + ph / 2 + 0.5);
                    ctx.restore();
                };
                drawBadge(chart._maxWeight, colorForWeight(chart._maxWeight));
                drawBadge(chart._minWeight, colorForWeight(chart._minWeight));
            }
        };

        const monthLabelsPlugin = {
            id: 'monthLabels',
            afterDraw(chart) {
                if (chart._compareMode) return;
                if (!chart._showMonthYearLabels) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (!chart._monthSegments || chart._monthSegments.length === 0) return;
                const xScale = scales.x;
                const chartWidth = chartArea.right - chartArea.left;
                const isSmall = chartWidth < 400;
                const fontPx = isSmall ? 8 : 10;
                const offset = isSmall ? 6 : 8;
                ctx.save();
                ctx.font = `bold ${fontPx}px Inter, sans-serif`;
                ctx.fillStyle = 'rgba(200, 216, 232, 0.75)';
                chart._monthSegments.forEach(seg => {
                    const xStart = xScale.getPixelForValue(seg.startIdx);
                    const xEnd   = xScale.getPixelForValue(seg.endIdx);
                    const xCenter = (xStart + xEnd) / 2;
                    if (xCenter >= chartArea.left && xCenter <= chartArea.right) {
                        const label = MONTHS_RU[seg.month];
                        ctx.save();
                        ctx.translate(xCenter, chartArea.bottom + offset);
                        ctx.rotate(-Math.PI / 2);
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(label, 0, 0);
                        ctx.restore();
                    }
                });
                ctx.restore();
            }
        };

        const yearLabelsPlugin = {
            id: 'yearLabels',
            afterDraw(chart) {
                if (chart._compareMode) return;
                if (!chart._showMonthYearLabels) return;
                const { ctx, chartArea, scales } = chart;
                if (!chartArea) return;
                if (!chart._yearSegments || chart._yearSegments.length === 0) return;
                const xScale = scales.x;
                const chartWidth = chartArea.right - chartArea.left;
                const isSmall = chartWidth < 400;
                const fontPx = isSmall ? 9 : 11;
                const offset = isSmall ? 38 : 42;
                ctx.save();
                ctx.font = `bold ${fontPx}px Inter, sans-serif`;
                ctx.fillStyle = 'rgba(200, 216, 232, 0.55)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                const y = chartArea.bottom + offset;
                chart._yearSegments.forEach(seg => {
                    const xStart = xScale.getPixelForValue(seg.startIdx);
                    const xEnd   = xScale.getPixelForValue(seg.endIdx);
                    const xCenter = (xStart + xEnd) / 2;
                    if (xCenter >= chartArea.left && xCenter <= chartArea.right) {
                        ctx.fillText(seg.year, xCenter, y);
                    }
                });
                ctx.restore();
            }
        };

        function filterByPeriod(entries, period) {
            if (period === 'all' || entries.length === 0) return entries.slice();
            const lastDate = entries[entries.length - 1].date;
            const from = new Date(lastDate);
            if (period === '1m') from.setMonth(from.getMonth() - 1);
            else if (period === '3m') from.setMonth(from.getMonth() - 3);
            else if (period === '6m') from.setMonth(from.getMonth() - 6);
            else if (period === '1y') from.setFullYear(from.getFullYear() - 1);
            return entries.filter(e => e.date >= from);
        }

        function updateStats(entries) {
            const currentEl = document.getElementById('currentWeight');
            const changeEl = document.getElementById('totalChange');
            const maxEl = document.getElementById('maxWeight');
            const minEl = document.getElementById('minWeight');
            const swingEl = document.getElementById('swingValue');

            if (entries.length === 0) {
                currentEl.textContent = '--';
                changeEl.textContent = '--';
                maxEl.textContent = '--';
                minEl.textContent = '--';
                swingEl.textContent = '--';
                return;
            }

            const lastEntry = entries[entries.length - 1];
            const prevEntry = entries.length > 1 ? entries[entries.length - 2] : null;
            const firstEntry = entries[0];

            let arrow = '';
            if (prevEntry) {
                const diff = lastEntry.weight - prevEntry.weight;
                if (Math.abs(diff) < 0.05) arrow = '<span class="trend-arrow trend-same">→</span>';
                else if (diff > 0) arrow = '<span class="trend-arrow trend-up">↑</span>';
                else arrow = '<span class="trend-arrow trend-down">↓</span>';
            }
            currentEl.innerHTML = lastEntry.weight.toFixed(1) + ' кг' + arrow +
                '<small>' + formatDateShort(lastEntry.date) + '</small>';
            currentEl.style.color = colorForWeight(lastEntry.weight);

            const change = lastEntry.weight - firstEntry.weight;
            const sign = change > 0 ? '+' : '';
            const range = formatDateShort(firstEntry.date) + ' → ' + formatDateShort(lastEntry.date);
            changeEl.innerHTML = sign + change.toFixed(1) + ' кг<small>' + range + '</small>';

            let maxW = -Infinity, minW = Infinity;
            let maxD = null, minD = null;
            entries.forEach(e => {
                if (e.weight > maxW) { maxW = e.weight; maxD = e.date; }
                if (e.weight < minW) { minW = e.weight; minD = e.date; }
            });
            maxEl.innerHTML = maxW.toFixed(1) + ' кг<small>' + formatDateShort(maxD) + '</small>';
            maxEl.style.color = colorForWeight(maxW);
            minEl.innerHTML = minW.toFixed(1) + ' кг<small>' + formatDateShort(minD) + '</small>';
            minEl.style.color = colorForWeight(minW);

            const swing = maxW - minW;
            swingEl.innerHTML = swing.toFixed(1) + ' кг<small>' + minW.toFixed(1) + ' → ' + maxW.toFixed(1) + '</small>';
        }

        function buildNormalChartData(entries) {
            if (entries.length === 0) {
                return { labels: [], weights: [], jan1Indices: [], yearSegments: [], monthSegments: [], vAxisIndex: 0 };
            }
            const firstDate = new Date(entries[0].date);
            firstDate.setHours(0, 0, 0, 0);
            const lastDate = new Date(entries[entries.length - 1].date);
            lastDate.setHours(0, 0, 0, 0);

            const byDay = {};
            entries.forEach(e => {
                const d = new Date(e.date);
                d.setHours(0, 0, 0, 0);
                byDay[d.toISOString().slice(0, 10)] = e.weight;
            });

            const labels = [];
            const weights = [];
            const dates = [];
            const jan1Indices = [];

            let idx = 0;
            for (let d = new Date(firstDate); d <= lastDate; d.setDate(d.getDate() + 1)) {
                const key = d.toISOString().slice(0, 10);
                labels.push(formatDateShort(d));
                dates.push(new Date(d));
                weights.push(byDay[key] !== undefined ? byDay[key] : 0);
                if (d.getMonth() === 0 && d.getDate() === 1) jan1Indices.push(idx);
                idx++;
            }

            let vAxisIndex = -1;
            for (let i = 0; i < dates.length; i++) {
                if (dates[i] >= V_AXIS_DATE) { vAxisIndex = i; break; }
            }
            if (vAxisIndex === -1) vAxisIndex = 0;

            const yearSegments = [];
            let curYear = null, startIdx = 0;
            for (let i = 0; i < dates.length; i++) {
                const y = dates[i].getFullYear();
                if (curYear === null) { curYear = y; startIdx = i; }
                else if (y !== curYear) {
                    yearSegments.push({ year: curYear, startIdx: startIdx, endIdx: i - 1 });
                    curYear = y;
                    startIdx = i;
                }
            }
            if (curYear !== null) yearSegments.push({ year: curYear, startIdx: startIdx, endIdx: dates.length - 1 });

            const monthSegments = [];
            let prevKey = null, segStart = 0;
            for (let i = 0; i < dates.length; i++) {
                const d = dates[i];
                const key = d.getFullYear() * 100 + d.getMonth();
                if (prevKey === null) { prevKey = key; segStart = i; }
                else if (key !== prevKey) {
                    monthSegments.push({
                        year: dates[segStart].getFullYear(),
                        month: dates[segStart].getMonth(),
                        startIdx: segStart,
                        endIdx: i - 1
                    });
                    prevKey = key;
                    segStart = i;
                }
            }
            if (prevKey !== null) {
                monthSegments.push({
                    year: dates[segStart].getFullYear(),
                    month: dates[segStart].getMonth(),
                    startIdx: segStart,
                    endIdx: dates.length - 1
                });
            }

            return { labels, weights, jan1Indices, yearSegments, monthSegments, vAxisIndex };
        }

        function buildCompareChartData(entries) {
            const byYear = {};
            entries.forEach(e => {
                const y = e.date.getFullYear();
                if (!byYear[y]) byYear[y] = [];
                byYear[y].push(e);
            });

            const years = Object.keys(byYear).map(Number).sort();
            const datasets = [];

            years.forEach((year, i) => {
                const color = YEAR_COLORS[i % YEAR_COLORS.length];
                const points = byYear[year].map(e => {
                    const startOfYear = new Date(year, 0, 1);
                    const dayOfYear = Math.floor((e.date - startOfYear) / 86400000) + 1;
                    return { x: dayOfYear, y: e.weight };
                });
                points.sort((a, b) => a.x - b.x);
                datasets.push({
                    label: String(year),
                    data: points,
                    borderColor: color,
                    backgroundColor: color,
                    showLine: false,
                    pointRadius: 2,
                    pointHoverRadius: 4,
                    pointBackgroundColor: color,
                    pointBorderColor: color,
                    parsing: false
                });
            });

            return { datasets, years };
        }

        function createNormalChart(entries) {
            if (chart) { chart.destroy(); chart = null; }
            const ctx = document.getElementById('weightChart').getContext('2d');
            const { labels, weights, jan1Indices, yearSegments, monthSegments, vAxisIndex } = buildNormalChartData(entries);
            const barColors = weights.map(w => w > 0 ? colorForWeight(w) : 'transparent');

            const isSmall = window.innerWidth < 600;
            const isLandscapePhone = window.innerWidth < 900 && window.innerWidth > window.innerHeight;
            const padTop = isLandscapePhone ? 6 : (isSmall ? 8 : 10);

            const showDateTicks = (CURRENT_PERIOD === '1m' || CURRENT_PERIOD === '3m');
            const showMonthYear = !showDateTicks;
            const showMonthGrid = (CURRENT_PERIOD === '6m' || CURRENT_PERIOD === '1y' || CURRENT_PERIOD === 'all');
            const padBottom = isLandscapePhone ? 60 : (isSmall ? 65 : 70);

            const barParams = getBarParams(CURRENT_PERIOD);

            let barPercentage = barParams.barPercentage;
            if (CURRENT_PERIOD === '1y') {
                const area = document.getElementById('chartContainer').getBoundingClientRect();
                const areaWidth = area.width - 24;
                const n = labels.length || 365;
                const catWidth = areaWidth / n;
                barPercentage = Math.max(0.01, (catWidth - 1) / catWidth);
                if (barPercentage > 1) barPercentage = 1;
            }

            chart = new Chart(ctx, {
                type: 'bar',
                plugins: [monthGridPlugin, yAxisLinePlugin, yearLinesPlugin, minMaxLinesPlugin, monthLabelsPlugin, yearLabelsPlugin],
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Масса тела (кг)',
                        data: weights,
                        backgroundColor: barColors,
                        borderColor: barColors,
                        borderWidth: 0,
                        borderRadius: 0,
                        barPercentage: barPercentage,
                        categoryPercentage: barParams.categoryPercentage
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 500, easing: 'easeOutQuart' },
                    interaction: { mode: 'index', intersect: false },
                    layout: { padding: { top: padTop, bottom: padBottom, left: 12, right: 12 } },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(44, 62, 80, 0.95)',
                            titleFont: { size: 11 },
                            bodyFont: { size: 12 },
                            padding: 10,
                            cornerRadius: 8,
                            callbacks: {
                                label: function(context) {
                                    const v = context.parsed.y;
                                    if (v === 0) return 'Нет данных (0 кг)';
                                    return 'Масса: ' + v.toFixed(1) + ' кг';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: 69, max: 76,
                            title: {
                                display: true,
                                text: 'Масса тела (кг)',
                                color: '#c8d8e8',
                                font: { size: 10 },
                                padding: { top: 0, bottom: 4 }
                            },
                            grid: { color: 'rgba(255,255,255,0.10)' },
                            ticks: {
                                color: '#c8d8e8',
                                stepSize: 1,
                                font: { size: 10 },
                                padding: 4
                            },
                            afterFit(scale) { scale.width += 8; }
                        },
                        x: {
                            title: { display: false },
                            grid: { display: false },
                            ticks: showDateTicks ? {
                                display: true,
                                color: '#c8d8e8',
                                font: { size: 9 },
                                maxRotation: 90,
                                minRotation: 90,
                                autoSkip: false,
                                callback: function(value) {
                                    return this.getLabelForValue(value);
                                }
                            } : {
                                display: false
                            }
                        }
                    }
                }
            });

            chart._compareMode = false;
            chart._showMonthYearLabels = showMonthYear;
            chart._showMonthGrid = showMonthGrid;
            chart._jan1Indices = jan1Indices;
            chart._yearSegments = yearSegments;
            chart._monthSegments = monthSegments;
            chart._vAxisIndex = vAxisIndex;

            setTimeout(() => {
                if (!chart) return;
                const area = chart.chartArea;
                const n = chart.data.labels.length;
                if (!area || n === 0) return;
                const catWidth = (area.right - area.left) / n;
                const barW = catWidth * barParams.categoryPercentage * barPercentage;
                chart._barWidthHalf = barW / 2;
                chart.draw();
            }, 0);

            let maxW = null, minW = null;
            entries.forEach(e => {
                if (maxW === null || e.weight > maxW) maxW = e.weight;
                if (minW === null || e.weight < minW) minW = e.weight;
            });
            chart._maxWeight = maxW;
            chart._minWeight = minW;

            window.weightChartInstance = chart;
        }

        function createCompareChart(entries) {
            if (chart) { chart.destroy(); chart = null; }
            const ctx = document.getElementById('weightChart').getContext('2d');
            const { datasets } = buildCompareChartData(entries);

            const isSmall = window.innerWidth < 600;
            const isLandscapePhone = window.innerWidth < 900 && window.innerWidth > window.innerHeight;
            const padTop = isLandscapePhone ? 6 : (isSmall ? 8 : 10);
            const padBottom = isLandscapePhone ? 30 : (isSmall ? 35 : 40);

            const MONTH_MID_DAY = [15, 45, 74, 105, 135, 166, 196, 227, 258, 288, 319, 349];

            const compareMonthLabelsPlugin = {
                id: 'compareMonths',
                afterDraw(c) {
                    const { ctx, chartArea, scales } = c;
                    if (!chartArea) return;
                    const xScale = scales.x;
                    const fontPx = isSmall ? 9 : 11;
                    ctx.save();
                    ctx.font = `bold ${fontPx}px Inter, sans-serif`;
                    ctx.fillStyle = 'rgba(200, 216, 232, 0.75)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    const y = chartArea.bottom + 6;
                    for (let m = 0; m < 12; m++) {
                        const x = xScale.getPixelForValue(MONTH_MID_DAY[m]);
                        if (x >= chartArea.left && x <= chartArea.right) {
                            ctx.fillText(MONTHS_RU[m], x, y);
                        }
                    }
                    ctx.restore();
                }
            };

            chart = new Chart(ctx, {
                type: 'line',
                plugins: [compareMonthGridPlugin, compareMonthLabelsPlugin],
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 500, easing: 'easeOutQuart' },
                    interaction: { mode: 'nearest', intersect: false },
                    layout: { padding: { top: padTop, bottom: padBottom, left: 12, right: 12 } },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#e8eef5',
                                font: { size: 12 },
                                boxWidth: 14,
                                boxHeight: 14,
                                padding: 24,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(44, 62, 80, 0.95)',
                            titleFont: { size: 11 },
                            bodyFont: { size: 12 },
                            padding: 10,
                            cornerRadius: 8,
                            callbacks: {
                                title: function(items) {
                                    if (!items.length) return '';
                                    const dayOfYear = items[0].parsed.x;
                                    const d = new Date(2024, 0, dayOfYear);
                                    return d.getDate() + ' ' + MONTHS_RU_FULL[d.getMonth()].toLowerCase();
                                },
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + ' кг';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            min: 69, max: 76,
                            title: {
                                display: true,
                                text: 'Масса тела (кг)',
                                color: '#c8d8e8',
                                font: { size: 10 },
                                padding: { top: 0, bottom: 4 }
                            },
                            grid: { color: 'rgba(255,255,255,0.10)' },
                            ticks: {
                                color: '#c8d8e8',
                                stepSize: 1,
                                font: { size: 10 },
                                padding: 4
                            },
                            afterFit(scale) { scale.width += 8; }
                        },
                        x: {
                            type: 'linear',
                            min: 1,
                            max: 365,
                            title: { display: false },
                            grid: { display: false },
                            ticks: { display: false }
                        }
                    }
                }
            });

            chart._compareMode = true;
            window.weightChartInstance = chart;
        }

        function redraw() {
            const filtered = filterByPeriod(ALL_ENTRIES, CURRENT_PERIOD);
            updateStats(filtered);
            if (COMPARE_MODE) createCompareChart(filtered);
            else createNormalChart(filtered);
        }

        async function loadData() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const dashboardEl = document.getElementById('dashboard');

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Ошибка сети при загрузке данных');
                const csvText = await response.text();
                const rows = parseCSV(csvText).map(r => r.map(c => c.trim()));
                if (rows.length < 2) throw new Error('В таблице недостаточно данных.');

                let headerRowIndex = 0, dateIndex = -1, weightIndex = -1;
                for (let i = 0; i < Math.min(5, rows.length); i++) {
                    const headers = rows[i].map(h => h.toLowerCase());
                    const d = headers.findIndex(h => h.includes('дата') || h.includes('date'));
                    const w = headers.findIndex(h =>
                        h.includes('масса') || h.includes('вес') ||
                        h.includes('weight') || h.includes('mass')
                    );
                    if (d !== -1 && w !== -1) { headerRowIndex = i; dateIndex = d; weightIndex = w; break; }
                }
                if (dateIndex === -1 || weightIndex === -1) { dateIndex = 0; weightIndex = 1; headerRowIndex = 0; }

                let entries = [];
                for (let i = headerRowIndex + 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length <= Math.max(dateIndex, weightIndex)) continue;
                    const dateStr = row[dateIndex];
                    const weightStr = row[weightIndex];
                    if (!dateStr) continue;

                    let date = null, match;
                    if ((match = dateStr.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2})$/)))
                        date = new Date(2000 + parseInt(match[3]), parseInt(match[2]) - 1, parseInt(match[1]));
                    else if ((match = dateStr.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/)))
                        date = new Date(parseInt(match[3]), parseInt(match[2]) - 1, parseInt(match[1]));
                    else if ((match = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))
                        date = new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
                    else date = new Date(dateStr);
                    if (!date || isNaN(date.getTime())) continue;
                    date.setHours(0, 0, 0, 0);

                    let weight = 0;
                    if (weightStr) {
                        const normalized = weightStr.replace(/\s/g, '').replace(',', '.');
                        const parsed = parseFloat(normalized);
                        if (!isNaN(parsed)) weight = parsed;
                    }
                    if (weight <= 0) continue;

                    entries.push({ date, weight });
                }

                if (entries.length === 0) throw new Error('Не удалось извлечь корректные данные.');

                entries = entries.filter(e => e.date <= MAX_DATE);

                if (entries.length === 0) throw new Error('После фильтрации по дате 31.12.2026 данные отсутствуют.');

                entries.sort((a, b) => a.date - b.date);
                ALL_ENTRIES = entries;

                loadingEl.style.display = 'none';
                dashboardEl.style.display = 'flex';
                redraw();

            } catch (error) {
                console.error('Ошибка:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = 'Не удалось загрузить данные: ' + error.message;
            }
        }

        function setupPeriodButtons() {
            document.querySelectorAll('.period-btn[data-period]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.period-btn[data-period]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    CURRENT_PERIOD = btn.dataset.period;
                    COMPARE_MODE = false;
                    document.getElementById('compareBtn').classList.remove('active');
                    redraw();
                });
            });
            document.getElementById('compareBtn').addEventListener('click', () => {
                COMPARE_MODE = !COMPARE_MODE;
                document.getElementById('compareBtn').classList.toggle('active', COMPARE_MODE);
                redraw();
            });
        }

        window.addEventListener('resize', () => { if (chart) chart.resize(); });

        window.onload = () => {
            setupPeriodButtons();
            loadData();
        };
    </script>
</body>
</html>
